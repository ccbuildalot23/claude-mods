<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep or Drop</title>
<style>
:root { --bg:#f8f5f3; --surface:#fff; --ink:#23213a; --muted:#6b6680; --line:#e6dfe0; --sun:#e7774f; --sun-soft:#fbe3d8; --sea:#2f7f86; --sea-soft:#dcefef; --gold:#b8862a; --gold-soft:#f6ead0;
  --display:"Iowan Old Style","Palatino Linotype",Georgia,serif; --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#17162a; --surface:#211f37; --ink:#f1ecef; --muted:#a9a3bd; --line:#343150; --sun:#f39371; --sun-soft:#4a2c2a; --sea:#6cc3c9; --sea-soft:#1d3b40; --gold:#e1b45c; --gold-soft:#3d3220; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); }
.wrap { max-width:1000px; margin:0 auto; padding:28px max(16px, env(safe-area-inset-right)) 80px max(16px, env(safe-area-inset-left)); display:grid; gap:18px; }
h1 { font:400 34px/1.1 var(--display); margin:0; }
.sub { color:var(--muted); margin:0; max-width:70ch; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
input[type=search], input[type=text], select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
button, .chip { font:600 13px var(--body); border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; }
button.primary { background:var(--sun); border-color:var(--sun); color:#1b1a2c; }
.chip[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
button:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--sea); outline-offset:2px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.pill { font:600 11px var(--body); letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:6px; background:var(--sea-soft); color:var(--sea); }
.pill.sun { background:var(--sun-soft); color:var(--sun); } .pill.gold { background:var(--gold-soft); color:var(--gold); }
.muted { color:var(--muted); } .mono { font-family:var(--mono); font-size:12.5px; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; } th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.scroll { overflow-x:auto; }

.seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.seg button { border:0; border-radius:0; padding:5px 10px; }
.seg button[aria-pressed=true].keep { background:var(--sea); color:#fff; }
.seg button[aria-pressed=true].drop { background:var(--sun); color:#1b1a2c; }
.age.stale { color:var(--sun); font-weight:600; }
pre { white-space:pre-wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; font:12.5px/1.5 var(--mono); }
h2 { font:400 24px var(--display); margin:10px 0 0; }
</style></head>
<body><div class="wrap">
  <header><h1>Keep or Drop</h1>
  <p class="sub" id="sub"></p></header>
  <div class="bar"><span class="muted" id="tally"></span><button class="primary" id="make">Show steps for the drops</button></div>
  <div id="steps" hidden>
    <h2>Paste into Terminal</h2><pre id="cmds"></pre><button id="copyCmds">Copy commands</button>
    <h2>By hand</h2><pre id="hand"></pre>
  </div>
  <div id="groups"></div>
</div>
<script>
const DATA = /*DATA*/null || { built: "", today: "", items: [], appTasksFound: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEY = "keep-or-drop";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
const days = s => s ? Math.floor((new Date(DATA.today) - new Date(s.slice(0, 10))) / 864e5) : null;
$("sub").textContent = `Built ${DATA.built}. Last output comes from job receipts in labeau-ops, never a "succeeded" status. ${DATA.appTasksFound ? "Last run comes from the Claude app's own scheduler file." : "The Claude app's scheduler file wasn't readable, so Claude tasks show receipts only."} Your marks stay in this browser.`;
function age(i) {
  const d = days(i.lastOutput);
  if (i.group !== "Routines") return "";
  if (d === null) return '<span class="age stale">no receipt on file</span>';
  return `<span class="age ${d > 10 ? "stale" : ""}">last output ${d === 0 ? "today" : d + " days ago"}</span>`;
}
const shut = {};
function draw() {
  const groups = [...new Set(DATA.items.map(i => i.group))];
  $("groups").innerHTML = groups.map(g => `<details data-g="${esc(g)}" ${(shut[g] ?? g === "Skills") ? "" : "open"}><summary><h2 style="display:inline">${esc(g)} (${DATA.items.filter(i => i.group === g).length})</h2></summary><div class="scroll"><table><thead><tr><th>Item</th><th>Evidence</th><th>Call</th></tr></thead><tbody>${
    DATA.items.filter(i => i.group === g).map(i => `<tr><td><b>${esc(i.name)}</b><div class="muted mono">${esc(i.where)}</div>${i.note ? `<div class="muted" style="font-size:13px">${esc(i.note)}</div>` : ""}</td>
      <td>${age(i)}${i.lastRun ? `<div class="muted">app last ran ${esc(i.lastRun.slice(0, 16))}</div>` : ""}${i.output ? `<div class="muted mono">${esc(i.output)}</div>` : ""}</td>
      <td>${i.locked ? '<span class="pill">locked on</span>' : `<span class="seg"><button class="keep" data-id="${esc(i.id)}" data-v="keep" aria-pressed="${marks[i.id] === "keep"}">Keep</button><button class="drop" data-id="${esc(i.id)}" data-v="drop" aria-pressed="${marks[i.id] === "drop"}">Drop</button></span>`}</td></tr>`).join("")
  }</tbody></table></div></details>`).join("");
  const v = Object.values(marks);
  $("tally").textContent = `${v.filter(x => x === "keep").length} keep · ${v.filter(x => x === "drop").length} drop · ${DATA.items.length - v.length} not decided`;
}
$("groups").addEventListener("toggle", e => { if (e.target.dataset?.g) shut[e.target.dataset.g] = !e.target.open; }, true);
$("groups").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; marks[b.dataset.id] = marks[b.dataset.id] === b.dataset.v ? undefined : b.dataset.v; if (!marks[b.dataset.id]) delete marks[b.dataset.id]; save(); draw(); });
$("make").addEventListener("click", () => {
  const drops = DATA.items.filter(i => marks[i.id] === "drop");
  $("cmds").textContent = drops.filter(i => i.cmd).map(i => i.cmd).join("\n") || "Nothing to paste.";
  $("hand").textContent = drops.filter(i => i.hand).map(i => "- " + i.hand).join("\n") || "Nothing by hand.";
  $("steps").hidden = false;
});
$("copyCmds").addEventListener("click", () => navigator.clipboard.writeText($("cmds").textContent).catch(() => {}));
draw();
</script></body></html>
