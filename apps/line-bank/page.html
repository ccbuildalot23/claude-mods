<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Bank</title>
<style>
:root { --bg:#f8f5f3; --surface:#fff; --ink:#23213a; --muted:#6b6680; --line:#e6dfe0; --sun:#e7774f; --sun-soft:#fbe3d8; --sea:#2f7f86; --sea-soft:#dcefef; --gold:#b8862a; --gold-soft:#f6ead0;
  --display:"Iowan Old Style","Palatino Linotype",Georgia,serif; --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#17162a; --surface:#211f37; --ink:#f1ecef; --muted:#a9a3bd; --line:#343150; --sun:#f39371; --sun-soft:#4a2c2a; --sea:#6cc3c9; --sea-soft:#1d3b40; --gold:#e1b45c; --gold-soft:#3d3220; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); }
.wrap { max-width:1000px; margin:0 auto; padding:28px max(16px, env(safe-area-inset-right)) 80px max(16px, env(safe-area-inset-left)); display:grid; gap:18px; }
h1 { font:400 34px/1.1 var(--display); margin:0; }
.sub { color:var(--muted); margin:0; max-width:70ch; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
input[type=search], input[type=text], select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
button, .chip { font:600 13px var(--body); border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; }
button.primary { background:var(--sun); border-color:var(--sun); color:#1b1a2c; }
.chip[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
button:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--sea); outline-offset:2px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.pill { font:600 11px var(--body); letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:6px; background:var(--sea-soft); color:var(--sea); }
.pill.sun { background:var(--sun-soft); color:var(--sun); } .pill.gold { background:var(--gold-soft); color:var(--gold); }
.muted { color:var(--muted); } .mono { font-family:var(--mono); font-size:12.5px; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; } th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.scroll { overflow-x:auto; }

.line { font:400 19px/1.45 var(--display); margin:6px 0; }
.meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; }
.list { display:grid; gap:10px; }
.count { font-variant-numeric:tabular-nums; }
</style></head>
<body><div class="wrap">
  <header><h1>Line Bank</h1>
  <p class="sub">Your own lines, as approved, with where each came from and how often it has gone out. This page only finds and counts; it never changes a word. Copy puts the line on your clipboard exactly as written.</p></header>
  <div class="bar">
    <input type="search" id="q" placeholder="Search words, e.g. sun" aria-label="Search lines">
    <select id="theme" aria-label="Theme"></select>
    <select id="sort" aria-label="Sort"><option value="fresh">Least used first</option><option value="used">Most used first</option><option value="poem">By poem</option></select>
    <button class="chip" id="unused" aria-pressed="false">Never used</button>
    <button class="chip" id="approvedOnly" aria-pressed="true">Approved only</button>
  </div>
  <div class="bar" id="images" aria-label="Images"></div>
  <p class="muted" id="summary"></p>
  <div class="list" id="list"></div>
</div>
<script>
const DATA = /*DATA*/null || { rows: [], centoCount: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const themes = [...new Set(DATA.rows.map(r => r.theme))].sort();
$("theme").innerHTML = '<option value="">All themes</option>' + themes.map(t => `<option>${esc(t)}</option>`).join("");
const imageNames = [...new Set(DATA.rows.flatMap(r => r.images))].sort();
const picked = new Set();
$("images").innerHTML = imageNames.map(n => `<button class="chip" data-img="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join("");
$("images").addEventListener("click", e => { const b = e.target.closest("[data-img]"); if (!b) return; const n = b.dataset.img; picked.has(n) ? picked.delete(n) : picked.add(n); b.setAttribute("aria-pressed", picked.has(n)); draw(); });
for (const id of ["unused", "approvedOnly"]) $(id).addEventListener("click", e => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); draw(); });
for (const id of ["q", "theme", "sort"]) $(id).addEventListener("input", draw);
const uses = r => r.posted + r.planned + r.centos.length;
function draw() {
  const q = $("q").value.trim().toLowerCase(), theme = $("theme").value, sort = $("sort").value;
  const unused = $("unused").getAttribute("aria-pressed") === "true", approved = $("approvedOnly").getAttribute("aria-pressed") === "true";
  let rows = DATA.rows.filter(r => (!q || r.lines.join(" ").toLowerCase().includes(q) || r.poem.toLowerCase().includes(q)) && (!theme || r.theme === theme)
    && [...picked].every(i => r.images.includes(i)) && (!unused || uses(r) === 0) && (!approved || r.approved));
  rows.sort(sort === "used" ? (a, b) => uses(b) - uses(a) : sort === "poem" ? (a, b) => a.poem.localeCompare(b.poem) : (a, b) => uses(a) - uses(b) || a.poem.localeCompare(b.poem));
  $("summary").textContent = `${rows.length} of ${DATA.rows.length} lines · ${DATA.centoCount} cento files checked`;
  $("list").innerHTML = rows.slice(0, 300).map(r => `<article class="card">
    ${r.lines.map(l => `<p class="line">${esc(l)}</p>`).join("")}
    <div class="meta"><span class="muted">${esc(r.poem)}</span><span class="pill">${esc(r.theme)}</span>${r.images.map(i => `<span class="pill gold">${esc(i)}</span>`).join("")}
      ${r.approved ? "" : '<span class="pill sun">proposed</span>'}
      <span class="muted count">posted ${r.posted} · planned ${r.planned}${r.centos.length ? " · in " + esc(r.centos.join(", ")) : ""}</span>
      <span class="mono muted">${esc(r.id)}</span>
      <button data-copy="${esc(r.lines.join("\n"))}">Copy</button></div></article>`).join("") || '<p class="muted">No lines match. Clear a filter.</p>';
}
$("list").addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (!b) return; navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); }, () => {}); });
draw();
</script></body></html>
